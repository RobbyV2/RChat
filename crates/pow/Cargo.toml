[package]
name = "rchat-pow"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "The proof-of-work puzzle, sealed trust strings and solver shared by the server, the apps and scripts"

[features]
default = ["threads"]
threads = []

[dependencies]
sha2 = { version = "0.11.1", default-features = false }
hmac = "0.13"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"

[[test]]
name = "solve"
required-features = ["threads"]
