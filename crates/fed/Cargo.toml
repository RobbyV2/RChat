[package]
name = "rchat-fed"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "The instance protocol: the call, keys, versions and the health rules between instances"

[dependencies]
prost = "=0.14.5"
ed25519-dalek = "2"
sha2 = "0.11.1"
base64 = "0.22"
serde_json = "1"

[build-dependencies]
prost-build = "=0.14.5"
protox = "=0.10.0"

[dev-dependencies]
hex = "0.4.3"
protox = "=0.10.0"
tokio = { version = "1", features = ["rt", "macros"] }
