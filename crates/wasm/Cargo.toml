[package]
name = "rust-next-wasm"
version = "0.3.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
rchat-profanity = { path = "../profanity" }

[dev-dependencies]
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
