[package]
name = "rchat-avatar"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Profile pictures: the chosen square of an image, decoded within bounds and encoded at fixed sizes"

[dependencies]
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }

[dev-dependencies]
serde_json = "1"
