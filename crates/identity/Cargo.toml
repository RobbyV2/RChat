[package]
name = "rchat-identity"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Two-factor, sign-in and provider rules shared by the server"

[features]
jose = ["dep:aws-lc-rs", "dep:serde", "dep:serde_json"]

[dependencies]
aws-lc-rs = { version = "1.18.2", default-features = false, features = [
  "aws-lc-sys",
], optional = true }
base64 = "0.22"
hmac = "0.13"
rand = "0.10"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
url = "2.5"

[dev-dependencies]
rchat-identity = { path = ".", features = ["jose"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
serde_json = "1"
