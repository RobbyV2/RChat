[package]
name = "rchat-identity"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Two-factor, sign-in and provider rules shared by the server"

[dependencies]
base64 = "0.22"
hmac = "0.13"
rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
url = "2.5"

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
serde_json = "1"
