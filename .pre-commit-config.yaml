# Setup: install pre-commit (or prek), then run `pre-commit install`.
# Commits run the formatters and linters. Pushes also run the Rust and script tests.
# The web suite and the build: `pre-commit run --hook-stage manual --all-files` (or `just src gates`).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --exclude rchat-desktop --exclude tauri-plugin-rchat-share --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: taplo-fmt
        name: taplo fmt
        entry: bunx @taplo/cli@0.7.0 fmt
        language: system
        types: [toml]

      - id: eslint
        name: eslint
        entry: bunx eslint . --ignore-pattern '.superpowers/**'
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: tsc
        name: tsc (web)
        entry: bunx tsc --noEmit --incremental false -p apps/web
        language: system
        files: ^apps/web/
        types_or: [ts, tsx]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: bunx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, markdown]

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --exclude rchat-desktop --exclude tauri-plugin-rchat-share
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push, manual]

      - id: desktop-clippy
        name: cargo clippy (desktop)
        entry: bash -c 'test -d apps/web/out || bun run build:desktop; cargo clippy -p rchat-desktop -p tauri-plugin-rchat-share --all-targets -- -D warnings'
        language: system
        files: ^apps/desktop/
        pass_filenames: false
        stages: [pre-push, manual]

      - id: script-tests
        name: bun test scripts
        entry: bun test scripts
        language: system
        files: ^(scripts|deploy|packaging|apps/desktop/scripts)/
        pass_filenames: false
        stages: [pre-push, manual]

      - id: web-tests
        name: bun test app (web)
        entry: bash -c 'cd apps/web && bun test app'
        language: system
        files: ^apps/web/
        pass_filenames: false
        stages: [manual]

      - id: build
        name: bun run build
        entry: bun run build
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
