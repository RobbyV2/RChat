name: release

# Stable releases come from version tags (0.3.0, 0.3.0-rc.1; no `v`, like the existing tags). The weekly channel is built every
# Monday, or by hand: a dated pre-release (weekly-YYYY-MM-DD) plus the moving `weekly` release
# that holds the updater manifest. Running this by hand on a tag rebuilds that stable release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || 'weekly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      wix_version: ${{ steps.meta.outputs.wix_version }}
      docker_tags: ${{ steps.meta.outputs.docker_tags }}
      linux_bundles: ${{ steps.meta.outputs.linux_bundles }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Weekly builds come from main only." >&2
            exit 1
          fi
          bun scripts/release.ts meta | tee -a "$GITHUB_OUTPUT"
      # A scheduled weekly build is skipped when `weekly` already points at this commit.
      - id: skip
        run: |
          current=$(git ls-remote origin refs/tags/weekly | cut -f1)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$current" = "$GITHUB_SHA" ]; then
            echo "No changes since the last weekly build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: [meta]
    if: needs.meta.outputs.skip != 'true'
    uses: ./.github/workflows/checks.yml

  server:
    needs: [meta, checks]
    name: server-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          - name: macos-universal
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: server-${{ matrix.name }}
      - name: Build
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in ${TARGETS//,/ }; do cargo build --release --bin server --target "$target"; done
      - name: Package
        env:
          NAME: ${{ matrix.name }}
          TARGETS: ${{ matrix.targets }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p stage dist
          archive="rchat-server_${VERSION}_${NAME}"
          case "$NAME" in
            macos-*) lipo -create -output stage/rchat-server target/{aarch64,x86_64}-apple-darwin/release/server ;;
            windows-*) cp "target/$TARGETS/release/server.exe" stage/rchat-server.exe ;;
            *) cp "target/$TARGETS/release/server" stage/rchat-server ;;
          esac
          if [[ "$NAME" == windows-* ]]; then
            (cd stage && 7z a "../dist/$archive.zip" rchat-server.exe)
          else
            tar -czf "dist/$archive.tar.gz" -C stage rchat-server
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: [meta, checks]
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      channel: ${{ needs.meta.outputs.channel }}
      wix-version: ${{ needs.meta.outputs.wix_version }}
      linux-bundles: ${{ needs.meta.outputs.linux_bundles }}
    secrets: inherit

  mobile:
    needs: [meta, checks]
    uses: ./.github/workflows/mobile.yml
    with:
      release: true
      version: ${{ needs.meta.outputs.version }}
      build-number: ${{ needs.meta.outputs.version_code }}
    secrets: inherit

  docker:
    needs: [meta, checks]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      push: true
      tags: ${{ needs.meta.outputs.docker_tags }}

  publish:
    needs: [meta, server, desktop, mobile, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      TITLE: ${{ needs.meta.outputs.title }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: '{desktop,mobile,server}-*'
          merge-multiple: true
      - name: Updater manifest
        run: bun scripts/release.ts updater dist
      - name: Packaging manifests
        run: |
          bun scripts/release.ts packaging dist "$RUNNER_TEMP/packaging"
          if [ -n "$(ls -A "$RUNNER_TEMP/packaging")" ]; then
            tar -czf "dist/rchat-packaging_${VERSION}.tar.gz" -C "$RUNNER_TEMP/packaging" .
          fi
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Stable release
        if: needs.meta.outputs.channel == 'stable'
        run: |
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); else flags=(--latest); fi
          # A re-run updates the release in place, so latest.json never disappears.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" "${flags[@]}"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TITLE" --generate-notes "${flags[@]}"
          fi
      - name: Weekly release
        if: needs.meta.outputs.channel == 'weekly'
        run: |
          move_tag() {
            git tag -f "$1" "$GITHUB_SHA"
            git push -f origin "refs/tags/$1"
          }
          gh release delete "$TAG" --yes 2>/dev/null || true
          move_tag "$TAG"
          gh release create "$TAG" dist/* --verify-tag --prerelease --latest=false --title "$TITLE" \
            --notes "Weekly build of ${GITHUB_SHA}. Version ${VERSION}."
          # `weekly` is what the app's weekly channel reads; `nightly` is kept for old links.
          move_tag weekly
          move_tag nightly
          # The `weekly` release is updated in place so latest.json never disappears.
          notes="Latest weekly build: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          pointer=(dist/SHA256SUMS)
          if [ -f dist/latest.json ]; then pointer+=(dist/latest.json); fi
          if gh release view weekly > /dev/null 2>&1; then
            gh release upload weekly "${pointer[@]}" --clobber
            gh release edit weekly --prerelease --latest=false --title "Weekly" --notes "$notes"
            if [ ! -f dist/latest.json ]; then gh release delete-asset weekly latest.json --yes 2>/dev/null || true; fi
          else
            gh release create weekly "${pointer[@]}" --verify-tag --prerelease --latest=false --title "Weekly" \
              --notes "$notes"
          fi
      - name: Prune old weekly releases
        if: needs.meta.outputs.channel == 'weekly'
        run: |
          # Keeps the 8 newest dated weekly releases (tags weekly-YYYY-MM-DD sort by date).
          gh release list --limit 200 --json tagName --jq '.[].tagName' |
            { grep -E '^weekly-[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true; } | sort -r | tail -n +9 |
            while read -r old; do
              echo "Deleting $old"
              gh release delete "$old" --yes --cleanup-tag
            done
