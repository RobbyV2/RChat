name: mobile

# Android and iOS builds. The native projects are generated here from apps/desktop/src-tauri and
# apps/desktop/mobile; they are never committed. ci.yml calls this for test builds (debug APK,
# sideload IPA), release.yml for release builds (signed when the secrets exist).
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      version:
        description: App version; empty keeps the one in apps/web/package.json
        type: string
        default: ''
      build-number:
        description: iOS build number and Android versionCode (the release run number)
        type: string
        default: ''
      retention-days:
        type: number
        default: 7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools ndk;27.2.12479018
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: tauri-cli
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-2.12.2
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked --force
      # The profanity filter's wasm, built by the Tauri beforeBuildCommand (`bun run build:tauri`).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: wasm-pack
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-0.15.0
      - if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.0 --locked --force
      # The wasm-bindgen Cargo.lock pins, so wasm-pack does not download one.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: wasm-bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-0.2.129
      - if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
      - run: bun apps/desktop/scripts/mobile.ts init android
      - name: Build debug APK
        if: ${{ !inputs.release }}
        working-directory: apps/desktop/src-tauri
        run: |
          cargo tauri android build --ci --debug --apk --target aarch64 armv7 x86_64
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
      - name: Build release APK and AAB
        if: inputs.release
        working-directory: apps/desktop/src-tauri
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.build-number }}
        run: |
          bun ../../../scripts/release.ts tauri-config "$RUNNER_TEMP/tauri.ci.json"
          cargo tauri android build --ci --apk --aab --target aarch64 armv7 x86_64 --config "$RUNNER_TEMP/tauri.ci.json"
      # With the keystore secrets the APK and AAB are signed with the release key. Without them
      # the APK is signed with a key made for this run (it installs, but cannot update a
      # previous install) and no AAB is published, since stores need the real key.
      - name: Sign
        if: inputs.release
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          out=apps/desktop/src-tauri/gen/android/app/build/outputs
          apk=$(find "$out/apk" -name '*release*.apk' | head -n 1)
          aab=$(find "$out/bundle" -name '*release*.aab' | head -n 1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "Android signing: release key"
            printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$ks"
          else
            echo "Android signing: one-off key (no ANDROID_KEYSTORE)"
            ANDROID_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS=rchat
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias rchat -keyalg RSA -keysize 4096 \
              -validity 10000 -dname CN=RChat -storepass "$ANDROID_KEYSTORE_PASSWORD"
          fi
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          mkdir -p dist
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/RChat_${VERSION}_android.apk" "$RUNNER_TEMP/aligned.apk"
          if [ -n "$ANDROID_KEYSTORE" ]; then
            jarsigner -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -signedjar "dist/RChat_${VERSION}_android.aab" "$aab" "$ANDROID_KEY_ALIAS"
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-android
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 14 }}

  mobile-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: brew install xcodegen
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: tauri-cli
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-2.12.2
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked --force
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: wasm-pack
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-0.15.0
      - if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.0 --locked --force
      # The wasm-bindgen Cargo.lock pins, so wasm-pack does not download one.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: wasm-bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-0.2.129
      - if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
      - run: bun apps/desktop/scripts/mobile.ts init ios
      # Every run makes this one. It is built without signing and then signed ad hoc, which
      # needs no Apple key, so sideloading tools install it.
      - name: Build sideload IPA
        working-directory: apps/desktop/src-tauri
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number || github.run_number }}
          NAME: ${{ inputs.release && format('RChat_{0}_ios_sideload.ipa', inputs.version) || 'RChat_sideload.ipa' }}
        run: |
          PLATFORM=ios bun ../../../scripts/release.ts tauri-config "$RUNNER_TEMP/tauri.ios.json"
          cargo tauri ios build --ci --no-sign --target aarch64 --build-number "$BUILD_NUMBER" --config "$RUNNER_TEMP/tauri.ios.json"
          ipa=$(find gen/apple/build -name '*.ipa' | head -n 1)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ../scripts/sideload-ipa.sh "$ipa" "$GITHUB_WORKSPACE/dist/$NAME"
          rm "$ipa"
      # The finished file, unpacked with the system unzip. The signature must verify, the version
      # must be three integers and the build must be the version plus the build number, which is
      # what altstore.json states (scripts/release.ts).
      - name: Check the sideload IPA
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number || github.run_number }}
        run: |
          unzip -q dist/*sideload.ipa -d "$RUNNER_TEMP/sideload"
          app=$(echo "$RUNNER_TEMP"/sideload/Payload/*.app)
          info="$app/Info.plist"
          codesign --verify --verbose=2 "$app"
          codesign --display --verbose=2 "$app"
          file "$app/$(plutil -extract CFBundleExecutable raw -o - "$info")"
          plutil -p "$info"
          version=$(plutil -extract CFBundleShortVersionString raw -o - "$info")
          build=$(plutil -extract CFBundleVersion raw -o - "$info")
          want=${VERSION%%-*}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$version" != "${want:-$version}" ] ||
            [ "$build" != "$version.$BUILD_NUMBER" ]; then
            echo "Unexpected version $version ($build), wanted ${want:-three integers} ($version.$BUILD_NUMBER)" >&2
            exit 1
          fi
      - id: signing
        if: inputs.release
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          if [ -n "$IOS_CERTIFICATE" ] && [ -n "$IOS_MOBILE_PROVISION" ] && [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "iOS signing: off (needs IOS_CERTIFICATE, IOS_MOBILE_PROVISION and APPLE_DEVELOPMENT_TEAM)"
          fi
      # An extra for releases whose repository has the signing secrets.
      - name: Build signed IPA
        if: steps.signing.outputs.present == 'true'
        working-directory: apps/desktop/src-tauri
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number || github.run_number }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          cargo tauri ios build --ci --target aarch64 --export-method "$EXPORT_METHOD" --build-number "$BUILD_NUMBER" --config "$RUNNER_TEMP/tauri.ios.json"
          cp "$(find gen/apple/build -name '*.ipa' | head -n 1)" "$GITHUB_WORKSPACE/dist/RChat_${VERSION}_ios.ipa"
      - run: ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 14 }}
