name: ci

# Fast checks run on every push and pull request. The heavy jobs (desktop, mobile, Docker and the
# desktop smoke run) run on pushes to main and manual runs; release.yml runs them for releases.
# Commit message tags and pull request labels can skip heavy parts (see scripts/ci-flags.sh).
# Fast checks finish for every main commit; a newer push cancels the older heavy jobs instead.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Labels of the pull request a push to main came from count like labels on the pull request.
  # CHANGED (the files of the push, unknown past the compare API's 300 file cap) drives the
  # mobile path filter.
  flags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.flags.outputs.desktop }}
      mobile: ${{ steps.flags.outputs.mobile }}
      docker: ${{ steps.flags.outputs.docker }}
      e2e: ${{ steps.flags.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - id: flags
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          LABELS=$PR_LABELS
          if [ "$EVENT" = push ]; then
            LABELS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[].labels[].name] | join(",")' 2>/dev/null || true)
            if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] &&
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null) &&
              [ -n "$files" ] && [ "$(wc -l <<<"$files")" -lt 300 ]; then
              export CHANGED=$files
            fi
          fi
          export LABELS
          scripts/ci-flags.sh | tee -a "$GITHUB_OUTPUT"

  desktop-smoke:
    concurrency:
      group: ci-heavy-desktop-smoke-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request' && needs.flags.outputs.e2e == 'true'
    needs: [checks, flags]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: tauri-cli
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-2.12.2
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked
      - run: cargo build --bin server
      - name: Headless smoke run
        env:
          APP_MODE: api-only
          SERVER_PORT: '3470'
          DATABASE_URL: /tmp/rchat-smoke.db
        run: |
          ./target/debug/server > /tmp/rchat-smoke-server.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:3470/api/health > /dev/null && break; sleep 1; done
          apps/desktop/scripts/smoke.sh http://localhost:3470

  desktop:
    concurrency:
      group: ci-heavy-desktop-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request' && needs.flags.outputs.desktop == 'true'
    needs: [checks, flags]
    uses: ./.github/workflows/desktop.yml

  mobile:
    concurrency:
      group: ci-heavy-mobile-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request' && needs.flags.outputs.mobile == 'true'
    needs: [checks, flags]
    uses: ./.github/workflows/mobile.yml

  docker:
    concurrency:
      group: ci-heavy-docker-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request' && needs.flags.outputs.docker == 'true'
    needs: [checks, flags]
    uses: ./.github/workflows/docker.yml
