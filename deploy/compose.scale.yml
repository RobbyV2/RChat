# Scaled RChat: each role runs in its own container behind nginx, with one Postgres and one
# Valkey (any Redis-protocol server works).
#
#   VALKEY_PASSWORD=$(openssl rand -hex 24) docker compose -f deploy/compose.scale.yml up -d
#
# You can also put VALKEY_PASSWORD in deploy/.env. Use a hex password (it goes in REDIS_URL).
# Valkey is not published on the host. Keep it on a private network (no TLS).
#
# nginx is the only proxy. It shares the edge network (RCHAT_EDGE_SUBNET, default
# 10.240.80.0/24) with the services, and they trust X-Forwarded-For only from that subnet.
# Postgres, Valkey, embeds and jobs are only on the backend network.
#
# Open http://localhost:8080 (RCHAT_HTTP_PORT). It is the only published port: PeerJS is at
# /peerjs on it, served by the peerjs service (the server's own PeerJS is per process, so it is
# off here). Set RCHAT_PUBLIC_PEERJS_URL only when PeerJS is on another address.
# Scale a role: docker compose -f deploy/compose.scale.yml up -d --scale gateway=4

x-rchat: &rchat
  image: ${RCHAT_IMAGE:-ghcr.io/robbyv2/rchat:weekly}
  restart: unless-stopped
  networks: [edge, backend]
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

x-env: &env
  HOST: 0.0.0.0
  DATABASE_URL: postgres://rchat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rchat
  REDIS_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD}@valkey:6379
  TRUSTED_PROXIES: ${RCHAT_EDGE_SUBNET:-10.240.80.0/24}
  RUST_LOG: ${RUST_LOG:-info}
  # Set PUBLIC_URL to the origin people open. Without it, the request host is used only if it is
  # loopback or in ALLOWED_HOSTS.
  INSTANCE_NAME: ${RCHAT_INSTANCE_NAME:-RChat}
  PUBLIC_URL: ${RCHAT_PUBLIC_URL:-}
  ALLOWED_HOSTS: ${RCHAT_ALLOWED_HOSTS:-}
  PUBLIC_PEERJS_URL: ${RCHAT_PUBLIC_PEERJS_URL:-}
  PEERJS_BUILTIN: "false"
  # Connection helpers for calls and P2P files, all off by default. RCHAT_PUBLIC_STUN=true gives
  # public STUN servers. RCHAT_RELAY_ENABLED=true (with RCHAT_RELAY_PUBLIC_IP, and
  # RCHAT_RELAY_HOST if needed) turns on the built-in relay. Run it with --profile relay.
  PUBLIC_STUN: ${RCHAT_PUBLIC_STUN:-false}
  RELAY_ENABLED: ${RCHAT_RELAY_ENABLED:-false}
  RELAY_HOST: ${RCHAT_RELAY_HOST:-}
  RELAY_PUBLIC_IP: ${RCHAT_RELAY_PUBLIC_IP:-}
  # Store media blobs in S3/minio instead of Postgres:
  # S3_ENDPOINT: http://minio:9000
  # S3_BUCKET: rchat
  # S3_ACCESS_KEY: ...
  # S3_SECRET_KEY: ...

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rchat
    networks: [backend]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rchat -d rchat -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # The password goes into a config file, not onto the command line, so ps does not show it.
    command:
      - sh
      - -c
      - >-
        case "$$VALKEY_PASSWORD" in *"'"*) echo "VALKEY_PASSWORD may not contain a single quote" >&2; exit 1;; esac;
        umask 077;
        printf "requirepass '%s'\n" "$$VALKEY_PASSWORD" > /tmp/valkey.conf;
        chown valkey:valkey /tmp/valkey.conf;
        exec docker-entrypoint.sh valkey-server /tmp/valkey.conf --appendonly yes
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
    networks: [backend]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *rchat
    environment:
      <<: *env
      RCHAT_ROLES: api
    deploy:
      replicas: 2

  gateway:
    <<: *rchat
    environment:
      <<: *env
      RCHAT_ROLES: gateway
    deploy:
      replicas: 2

  media:
    <<: *rchat
    environment:
      <<: *env
      RCHAT_ROLES: media

  search:
    <<: *rchat
    environment:
      <<: *env
      RCHAT_ROLES: search

  embeds:
    <<: *rchat
    networks: [backend]
    environment:
      <<: *env
      RCHAT_ROLES: embeds

  jobs:
    <<: *rchat
    networks: [backend]
    environment:
      <<: *env
      RCHAT_ROLES: jobs

  web:
    <<: *rchat
    environment:
      <<: *env
      RCHAT_ROLES: web
    deploy:
      replicas: 2

  # The built-in STUN and TURN relay, one container. Start it with --profile relay and
  # RCHAT_RELAY_ENABLED=true. It needs DATABASE_URL and REDIS_URL. It publishes UDP 3478 and
  # 49160-49415. Reserve that range on the host:
  # sysctl net.ipv4.ip_local_reserved_ports=49160-49415.
  # It never relays to private, loopback or metadata addresses, or to its own RELAY_PUBLIC_IP.
  relay:
    <<: *rchat
    profiles: [relay]
    networks: [backend]
    environment:
      <<: *env
      RCHAT_ROLES: relay
      RELAY_ENABLED: "true"
    ports:
      - "3478:3478/udp"
      - "49160-49415:49160-49415/udp"

  peerjs:
    image: ${RCHAT_IMAGE:-ghcr.io/robbyv2/rchat:weekly}
    restart: unless-stopped
    command: ["/app/start.sh", "peer"]
    networks: [edge]
    environment:
      TRUSTED_PROXIES: ${RCHAT_EDGE_SUBNET:-10.240.80.0/24}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9001/peerjs > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    networks: [edge]
    ports:
      - "${RCHAT_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
      media:
        condition: service_healthy
      search:
        condition: service_healthy
      web:
        condition: service_healthy
      peerjs:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: ${RCHAT_EDGE_SUBNET:-10.240.80.0/24}
  backend: {}

volumes:
  pgdata:
  valkeydata:
