version: 1
metadata:
  name: RChat local demo
entries:
  - model: authentik_core.group
    id: staff
    identifiers: { name: rchat-staff }
  - model: authentik_core.group
    id: eng
    identifiers: { name: eng }
  - model: authentik_core.user
    identifiers: { username: alice }
    attrs:
      name: Alice
      password: !Env DEMO_ALICE_PASSWORD
      groups: [!KeyOf staff, !KeyOf eng]
  - model: authentik_core.user
    identifiers: { username: bob }
    attrs:
      name: Bob
      password: !Env DEMO_BOB_PASSWORD
      groups: [!KeyOf staff]
  - model: authentik_providers_oauth2.oauth2provider
    id: oidc
    identifiers: { name: RChat OIDC }
    attrs:
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: rchat
      client_secret: !Env OIDC_AUTHENTIK_CLIENT_SECRET
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
      redirect_uris:
        - {
            matching_mode: strict,
            redirect_uri_type: authorization,
            url: 'http://localhost:3000/api/auth/oidc/authentik/callback',
          }
        - { matching_mode: strict, redirect_uri_type: logout, url: 'http://localhost:3000/login' }
      logout_method: backchannel
      logout_uri: http://host.docker.internal:3000/api/auth/oidc/authentik/backchannel_logout
  - model: authentik_providers_scim.scimprovider
    id: scim
    identifiers: { name: RChat SCIM }
    attrs:
      url: http://host.docker.internal:3000/scim/v2
      token: !Env SCIM_TOKEN
      exclude_users_service_account: true
      group_filters: [!KeyOf staff, !KeyOf eng]
      property_mappings:
        - !Find [
            authentik_providers_scim.scimmapping,
            [managed, goauthentik.io/providers/scim/user],
          ]
      property_mappings_group:
        - !Find [
            authentik_providers_scim.scimmapping,
            [managed, goauthentik.io/providers/scim/group],
          ]
  - model: authentik_core.application
    id: app
    identifiers: { slug: rchat }
    attrs:
      name: RChat
      provider: !KeyOf oidc
      backchannel_providers: [!KeyOf scim]
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app, order: 0 }
    attrs: { group: !KeyOf staff }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app, order: 1 }
    attrs: { group: !KeyOf eng }
