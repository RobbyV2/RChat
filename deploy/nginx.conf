worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # Cluster-wide limit for the routes the backends limit strictly (auth, password change,
    # guest_access, media upload: 2 requests/s, burst 30, one bucket per client address;
    # invite lookups have a bucket of their own with the same rate). The backends' own
    # limiter counts per instance, so N instances alone would allow N times as much.
    # $binary_remote_addr is the client only when this nginx is the edge; behind another
    # balancer, set real_ip_header/set_real_ip_from first. CORS preflights are not counted.
    map $request_method $strict_client {
        OPTIONS "";
        default $binary_remote_addr;
    }

    limit_req_zone $strict_client zone=strict:10m rate=2r/s;
    limit_req_zone $strict_client zone=invites:10m rate=2r/s;
    limit_req_status 429;

    upstream api {
        zone api 64k;
        server api:3000 resolve;
        keepalive 32;
    }

    upstream gateway {
        zone gateway 64k;
        server gateway:3000 resolve;
    }

    upstream media {
        zone media 64k;
        server media:3000 resolve;
        keepalive 16;
    }

    upstream search {
        zone search 64k;
        server search:3000 resolve;
        keepalive 16;
    }

    upstream web {
        zone web 64k;
        server web:3000 resolve;
        keepalive 16;
    }

    upstream peerjs {
        zone peerjs 64k;
        server peerjs:9001 resolve;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The backends trust these headers only from the edge network (TRUSTED_PROXIES) and
    # take the right-most untrusted X-Forwarded-For hop. Overwriting with the one client
    # address keeps that unambiguous and also works for backends on TRUST_PROXY=true.
    # X-Forwarded-For is read before X-Real-IP, so it must be set here, not only X-Real-IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 26m;

    server {
        listen 80;

        location = /api/ws {
            proxy_pass http://gateway;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location = /api/media {
            limit_req zone=strict burst=30 nodelay;
            proxy_pass http://media;
        }

        location ^~ /api/media {
            proxy_pass http://media;
        }

        location ^~ /api/auth/ {
            limit_req zone=strict burst=30 nodelay;
            proxy_pass http://api;
        }

        location = /api/me/password {
            limit_req zone=strict burst=30 nodelay;
            proxy_pass http://api;
        }

        location ~ ^/api/servers/.+/guest_access$ {
            limit_req zone=strict burst=30 nodelay;
            proxy_pass http://api;
        }

        location ^~ /api/invites/ {
            limit_req zone=invites burst=30 nodelay;
            proxy_pass http://api;
        }

        location = /api/search {
            proxy_pass http://search;
        }

        location = /api/server_search {
            proxy_pass http://search;
        }

        location /api/ {
            proxy_pass http://api;
        }

        location /peerjs {
            proxy_pass http://peerjs;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://web;
        }
    }

    server {
        listen 9001;

        location / {
            proxy_pass http://peerjs;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
