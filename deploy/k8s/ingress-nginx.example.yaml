# Example ingress-nginx settings for RChat behind an L7 load balancer that appends the client
# address to X-Forwarded-For. Not part of the kustomize base. Merge the keys into the ConfigMap of
# your controller, or use Helm:
#
#   helm upgrade ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --reuse-values \
#     --set-string controller.config.use-forwarded-headers=true \
#     --set-string controller.config.proxy-real-ip-cidr=<balancer CIDR> \
#     --set-string controller.config.compute-full-forwarded-for=false \
#     --set-string controller.config.limit-req-status-code=429
#
# If clients connect directly, or through an L4 balancer that keeps the source address or uses
# the PROXY protocol, keep use-forwarded-headers "false" and set only limit-req-status-code.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
data:
  use-forwarded-headers: "true"
  # REPLACE with the address ranges of your load balancer, comma separated. Never use
  # 0.0.0.0/0: it trusts all hops, so a client can set its own address.
  proxy-real-ip-cidr: "192.0.2.0/24"
  # Send only the resolved client address to the backends.
  compute-full-forwarded-for: "false"
  limit-req-status-code: "429"
