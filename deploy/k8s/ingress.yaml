# Same path routing as deploy/nginx.conf, with an /api/v1/<x> twin for each /api/<x> path. The
# browser dials PeerJS at /peerjs of the page's origin, which this Ingress sends to rchat-peerjs.
#
# rchat-strict adds the cluster-wide rate limit for auth, password changes, guest_access and
# media uploads. rchat-invites and rchat-joins add the same limit, each in its own bucket. The
# regex paths of rchat-strict make all paths of this host case-insensitive regex prefixes. The
# paths here stay correct.
#
# Client address: the controller ConfigMap sets it (see ingress-nginx.example.yaml):
# - Direct clients, or an L4 balancer that keeps the source address or uses the PROXY protocol:
#   keep use-forwarded-headers "false" (the default).
# - An L7 balancer that appends to X-Forwarded-For: set use-forwarded-headers "true" and
#   proxy-real-ip-cidr to the balancer range. The balancer must also overwrite
#   X-Forwarded-Host and X-Forwarded-Proto.
# networkpolicy.yaml lets only the controller reach the pods, so no other pod can forge headers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rchat
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
spec:
  ingressClassName: nginx
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /api/ws
            pathType: Exact
            backend:
              service:
                name: rchat-gateway
                port:
                  name: http
          - path: /api/v1/ws
            pathType: Exact
            backend:
              service:
                name: rchat-gateway
                port:
                  name: http
          - path: /api/media
            pathType: Prefix
            backend:
              service:
                name: rchat-media
                port:
                  name: http
          - path: /api/v1/media
            pathType: Prefix
            backend:
              service:
                name: rchat-media
                port:
                  name: http
          - path: /api/search
            pathType: Exact
            backend:
              service:
                name: rchat-search
                port:
                  name: http
          - path: /api/v1/search
            pathType: Exact
            backend:
              service:
                name: rchat-search
                port:
                  name: http
          - path: /api/server_search
            pathType: Exact
            backend:
              service:
                name: rchat-search
                port:
                  name: http
          - path: /api/v1/server_search
            pathType: Exact
            backend:
              service:
                name: rchat-search
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /.well-known/rchat
            pathType: Exact
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /peerjs
            pathType: Prefix
            backend:
              service:
                name: rchat-peerjs
                port:
                  name: peer
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rchat-web
                port:
                  name: http
---
# The backends limit these routes per instance (2 requests/s, burst 30 per client address).
# The edge sets the same limit for all replicas. ingress-nginx counts per controller pod and
# answers 503 unless the controller ConfigMap sets limit-req-status-code: "429".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rchat-strict
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/limit-rps: "2"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "15"
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
spec:
  ingressClassName: nginx
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /api/auth/
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /api/v1/auth/
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /api/me/password$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /api/v1/me/password$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /api/servers/.+/guest_access$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /api/v1/servers/.+/guest_access$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /api/media$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-media
                port:
                  name: http
          - path: /api/v1/media$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-media
                port:
                  name: http
---
# Invite lookups get the same limit in their own bucket, so they cannot block logins or uploads.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rchat-invites
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "2"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "15"
spec:
  ingressClassName: nginx
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /api/invites/
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /api/v1/invites/
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
---
# Server joins check the server password, so they get the same limit in their own bucket.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rchat-joins
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/limit-rps: "2"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "15"
spec:
  ingressClassName: nginx
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /api/servers/.+/join$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
          - path: /api/v1/servers/.+/join$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rchat-api
                port:
                  name: http
