# Only the ingress controller can connect to the RChat pods. The roles never call each other
# (they share state through Postgres and rchat-valkey, see valkey.yaml), so no pod-to-pod
# traffic is allowed. rchat-embeds and rchat-jobs have no Ingress route and serve only probes.
# Kubelet probes come from the node, which Calico and Cilium allow. This needs a CNI that
# enforces NetworkPolicy. The optional rchat-relay pod (relay.yaml) uses hostNetwork, which
# NetworkPolicy does not cover.
#
# REPLACE the two selectors below if your controller is not a standard ingress-nginx install
# (namespace ingress-nginx, pods labelled app.kubernetes.io/name: ingress-nginx and
# app.kubernetes.io/component: controller).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rchat-from-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - rchat-api
          - rchat-gateway
          - rchat-media
          - rchat-search
          - rchat-embeds
          - rchat-jobs
          - rchat-web
          - rchat-peerjs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9001
