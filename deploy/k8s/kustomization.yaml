apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rchat

labels:
  - pairs:
      app.kubernetes.io/part-of: rchat

resources:
  - namespace.yaml
  - config.yaml
  - valkey.yaml
  - roles.yaml
  - peerjs.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: ghcr.io/robbyv2/rchat
    newTag: nightly

# rchat-secrets comes from secrets.env. Create it from secrets.env.example and never commit
# it. A change to a secret restarts the pods that use it.
secretGenerator:
  - name: rchat-secrets
    envs:
      - secrets.env
