# Single-node Valkey for the realtime bus and job queue. For production, use a managed Redis
# or Valkey with failover. Any client of the bus can send realtime events, so it needs
# VALKEY_PASSWORD, and the NetworkPolicy below lets only the RChat pods reach it. The password
# goes into a config file, not onto the command line, so ps does not show it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rchat-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rchat-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rchat-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args:
            - sh
            - -c
            - >-
              test -n "$VALKEY_PASSWORD" || { echo "VALKEY_PASSWORD is empty" >&2; exit 1; };
              case "$VALKEY_PASSWORD" in *"'"*) echo "VALKEY_PASSWORD may not contain a single quote" >&2; exit 1;; esac;
              umask 077;
              printf "requirepass '%s'\n" "$VALKEY_PASSWORD" > /tmp/valkey.conf;
              chown valkey:valkey /tmp/valkey.conf 2>/dev/null || true;
              exec docker-entrypoint.sh valkey-server /tmp/valkey.conf --appendonly yes
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rchat-secrets
                  key: VALKEY_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: rchat-secrets
                  key: VALKEY_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rchat-valkey
spec:
  selector:
    app.kubernetes.io/name: rchat-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rchat-valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rchat-valkey
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - rchat-api
                  - rchat-gateway
                  - rchat-media
                  - rchat-search
                  - rchat-embeds
                  - rchat-jobs
        # The optional rchat-relay pod connects from the address of its node. Add the node here:
        # - ipBlock:
        #     cidr: REPLACE-with-the-relay-node-internal-IP/32
      ports:
        - protocol: TCP
          port: 6379
