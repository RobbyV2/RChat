# TRUSTED_PROXIES: the backends read X-Forwarded-For only from these peers. REPLACE the
# placeholder with the pod range of your ingress controller, usually the cluster pod CIDR
# (10.244.0.0/16 with kubeadm and flannel, 10.42.0.0/16 with k3s; see
# kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'), or the node range if the
# controller uses hostNetwork. The pods do not start until it is a valid list. The full pod
# range is safe because networkpolicy.yaml lets only the controller reach the pods. A narrower
# range is better. Each listed proxy must set X-Forwarded-For itself (ingress-nginx does).
# The secrets (DATABASE_URL, VALKEY_PASSWORD, REDIS_URL) come from secrets.env through the
# secretGenerator in kustomization.yaml. See secrets.env.example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rchat-config
data:
  HOST: "0.0.0.0"
  TRUSTED_PROXIES: "REPLACE-with-the-ingress-controller-pod-CIDR"
  RUST_LOG: info
  DATABASE_MAX_CONNECTIONS: "8"
  # All replicas share the instance id and signing key in Postgres.
  INSTANCE_NAME: RChat
  # REPLACE with the origin people open (for example https://chat.example.com). The pods do
  # not start until you do.
  PUBLIC_URL: "REPLACE-with-your-public-origin"
  # ALLOWED_HOSTS: "chat.example.com"
  # Connection helpers for calls and P2P files. All are off by default.
  # PUBLIC_STUN: "false"
  # The relay runs only in the rchat-relay pod (relay.yaml). All pods need these values.
  # RELAY_ENABLED: "false"
  # RELAY_HOST: "relay.example.com"
  # RELAY_PUBLIC_IP: "203.0.113.10"
  # Public addresses the relay must never reach (see relay.yaml):
  # RELAY_DENIED_PEERS: "203.0.113.0/24"
  # RELAY_USER_ALLOCATIONS: "16"
  # ICE_SERVERS: '[{"urls":"turn:turn.example.com:3478","username":"u","credential":"p"}]'
