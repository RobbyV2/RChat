apiVersion: apps/v1
kind: Deployment
metadata:
  name: rchat-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rchat-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rchat-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: rchat
          image: ghcr.io/robbyv2/rchat:nightly
          command:
            - sh
            - -c
            - >-
              test -n "$DATABASE_URL" && test -n "$REDIS_URL" ||
              { echo "DATABASE_URL and REDIS_URL in rchat-secrets must not be empty" >&2; exit 1; };
              exec /app/start.sh
          env:
            - name: RCHAT_ROLES
              value: api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rchat-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rchat-secrets
                  key: REDIS_URL
          envFrom:
            - configMapRef:
                name: rchat-config
            - secretRef:
                name: rchat-secrets
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rchat-api
spec:
  selector:
    app.kubernetes.io/name: rchat-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
