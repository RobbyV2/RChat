# Optional built-in STUN and TURN relay. Off by default and not in kustomization.yaml. To run it:
#   1. In config.yaml, set RELAY_ENABLED: "true", RELAY_HOST (the name clients use) and
#      RELAY_PUBLIC_IP (the public address of the node).
#   2. Add relay.yaml to the resources in kustomization.yaml.
#   3. The relay needs REDIS_URL. Add the internal IP of the node as an ipBlock in the
#      rchat-valkey NetworkPolicy (valkey.yaml has the entry as a comment).
# The relay runs as one hostNetwork pod, because TURN needs UDP 3478 and the port range
# 49160-49415 on a public address. Pin it to the node with that IP (nodeSelector) and open those
# UDP ports in the firewall. Reserve the range on the node:
# net.ipv4.ip_local_reserved_ports=49160-49415. Leave RELAY_ALLOW_PRIVATE unset.
# The relay refuses private, loopback, link-local, CGNAT and metadata addresses, and its own
# RELAY_PUBLIC_IP. It cannot know the other public addresses of the cluster (other nodes, load
# balancers, ingress IPs). Put them in RELAY_DENIED_PEERS (config.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rchat-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rchat-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rchat-relay
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      # nodeSelector:
      #   kubernetes.io/hostname: REPLACE-with-the-node-that-owns-RELAY_PUBLIC_IP
      containers:
        - name: rchat
          image: ghcr.io/robbyv2/rchat:nightly
          command:
            - sh
            - -c
            - >-
              test -n "$DATABASE_URL" && test -n "$REDIS_URL" ||
              { echo "DATABASE_URL and REDIS_URL in rchat-secrets must not be empty" >&2; exit 1; };
              exec /app/start.sh
          env:
            - name: RCHAT_ROLES
              value: relay
            - name: HOST
              value: 127.0.0.1
            - name: SERVER_PORT
              value: "3270"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rchat-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rchat-secrets
                  key: REDIS_URL
          envFrom:
            - configMapRef:
                name: rchat-config
          ports:
            - name: stun
              containerPort: 3478
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3270
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
