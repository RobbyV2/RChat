[workspace]
resolver = "3"
members = [
  "apps/server",
  "apps/desktop/core",
  "apps/desktop/src-tauri",
  "apps/desktop/plugins/share",
  "crates/app-docs",
  "crates/app-sheet",
  "crates/automation",
  "crates/avatar",
  "crates/fed",
  "crates/identity",
  "crates/perms",
  "crates/pow",
  "crates/pow-wasm",
  "crates/profanity",
  "crates/wasm",
]
default-members = ["apps/server", "apps/desktop/core"]

# The desktop shell takes Tauri from here. With the `tray-icon` feature in its own manifest, the
# Tauri CLI asks for an appindicator package when it bundles on Linux and adds it to the .deb.
[workspace.dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
