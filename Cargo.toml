[workspace]
resolver = "3"
members = [
  "apps/server",
  "apps/desktop/core",
  "apps/desktop/src-tauri",
  "apps/desktop/plugins/share",
  "crates/fed",
  "crates/identity",
  "crates/pow",
  "crates/pow-wasm",
  "crates/profanity",
  "crates/wasm",
]
default-members = ["apps/server", "apps/desktop/core"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
