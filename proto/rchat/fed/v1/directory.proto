syntax = "proto3";

package rchat.fed.v1;

// Feature `directory` (0.9.0): the callee's public servers, as its guests see them.
service DirectoryService {
  rpc Search(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  // 0 to 100 characters; empty lists the most active public servers.
  string query = 1;
  bytes cursor = 2;
}

message SearchResponse {
  // At most 50.
  repeated DirectoryServer servers = 1;
  bytes next = 2;
}

message DirectoryServer {
  string server = 1;
  string name = 2;
  string description = 3;
  bytes icon_sha256 = 4;
  uint32 members = 5;
  uint32 online = 6;
}
