[package]
name = "rchat-desktop"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "RChat desktop shell"
publish = false

[lib]
name = "rchat_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rchat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rchat-desktop-core = { path = "../core" }
tauri = { workspace = true }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-deep-link = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-autostart = "2.7"

# Tauri's tray as a StatusNotifierItem over D-Bus (left click opens, no libayatana-appindicator).
# Tauri turns on tray-icon's appindicator backend, and tray-icon prefers ksni when both are on.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
zbus = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2.7"
tauri-plugin-rchat-share = { path = "../plugins/share" }

[features]
smoke = []
