[package]
name = "rchat-desktop"
version = "0.2.2"
edition = "2024"
description = "RChat desktop shell"
publish = false

[lib]
name = "rchat_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rchat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-deep-link = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-autostart = "2.7"

[features]
smoke = []
