[package]
name = "rust-next"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "Rust + Next.js full-stack template with WASM support"

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "sink",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
config = "0.15"
clap = { version = "4", features = ["derive"] }
tower_governor = "0.8"
sqlx = { version = "0.9", features = [
  "any",
  "sqlite",
  "postgres",
  "runtime-tokio",
] }
rchat-profanity = { path = "../../crates/profanity" }
sha2 = "0.11.1"
hmac = "0.13"
hex = "0.4.3"
rand = "0.10.3"
rand_chacha = "0.10.0"
memorable-wordlist = "0.1.7"
argon2 = "0.6"
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tl = "0.7.8"
url = "2.5.8"
percent-encoding = "2.3.2"
rust-s3 = { version = "0.38.0", default-features = false, features = [
  "tokio-rustls-tls",
  "fail-on-err",
] }
redis = { version = "1.8", default-features = false, features = [
  "tokio-comp",
  "streams",
  "connection-manager",
] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
base64 = "0.22"
regex = "1"
emojis = "0.9.1"
unicode-security = "=0.1.2"
caseless = "=0.2.2"
unicode-normalization = "=0.1.26"
unicode-properties = "=0.1.4"
turn = "0.17.2"
sha1 = "0.11"
async-trait = "0.1"
stun = "0.17.2"
webrtc-util = { version = "0.17.2", default-features = false, features = [
  "conn",
] }

[dev-dependencies]
rust-next-wasm = { path = "../../crates/wasm" }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = [
  "connect",
] }
tokio = { version = "1", features = ["full", "test-util"] }
